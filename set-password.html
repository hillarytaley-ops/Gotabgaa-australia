<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set or reset your Gotabgaa Australia member password.">
  <title>Set Password | Gotabgaa Australia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=22">
  <link rel="icon" href="assets/logo-round.png" type="image/png">
  <link rel="canonical" href="https://gotabgaa-australia.vercel.app/set-password.html">
</head>
<body class="page-sub page-signin">
  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="nav__brand">
        <img src="assets/logo-round.png" alt="Gotabgaa Australia" class="nav__logo logo-circle">
        <span class="nav__title">Gotabgaa <strong>Australia</strong></span>
      </a>
      <ul class="nav__menu" id="navMenu">
        <li><a href="login.html" class="btn btn--outline nav__cta nav__cta--member">Sign In</a></li>
        <li><a href="join.html" class="btn btn--primary nav__cta">Join Us</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-page__bg" aria-hidden="true"></div>
    <div class="container auth-page__container">
      <div class="auth-card">
        <div class="auth-card__brand">
          <img src="assets/logo-round.png" alt="" class="auth-card__logo logo-circle" width="72" height="72">
          <p class="auth-card__org">Gotabgaa Australia</p>
          <h1 class="auth-card__title">Set password</h1>
          <p class="auth-card__subtitle" id="setPasswordSubtitle">Choose a secure password for your member account.</p>
        </div>
        <div class="auth-card__body">
          <form id="setPasswordForm" class="auth-form" novalidate>
            <div class="form__group">
              <label for="newPassword">New password</label>
              <div class="auth-form__password">
                <input type="password" id="newPassword" name="password" required autocomplete="new-password" placeholder="At least 8 characters" minlength="8">
                <button type="button" class="auth-form__toggle-pass" id="toggleNewPassword" aria-label="Show password" aria-pressed="false">
                  <span data-show>Show</span>
                  <span data-hide hidden>Hide</span>
                </button>
              </div>
            </div>
            <div class="form__group">
              <label for="confirmPassword">Confirm password</label>
              <input type="password" id="confirmPassword" name="confirm" required autocomplete="new-password" placeholder="Re-enter your password" minlength="8">
            </div>
            <p class="form__error auth-form__error" id="setPasswordError" hidden role="alert"></p>
            <p class="auth-form__success" id="setPasswordSuccess" hidden role="status"></p>
            <button type="submit" class="btn btn--primary btn--block auth-form__submit" id="setPasswordBtn">Save password</button>
          </form>
          <p class="auth-card__footer"><a href="login.html">Back to sign in</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
  <script src="js/supabase-browser.js?v=22"></script>
  <script src="js/set-password.js?v=22"></script>
</body>
</html>
